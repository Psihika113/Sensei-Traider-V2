# config/risk_config.yaml

# Максимальный риск на сделку как доля от equity (0.0075 = 0.75%).
risk_pct_equity_cap: 0.0075

# Дневной лимит просадки по эквити (0.02 = -2%).
daily_loss_limit_pct: 0.02

# Минимальное отношение reward/risk (RR).
min_rr: 1.5

# Минимальная откалиброванная вероятность выигрыша.
min_p_win: 0.60

# Комиссии IBKR (примерные значения, настроить под реальные).
commission_per_share: 0.0035
commission_min: 0.35

# Простая модель проскальзывания.
slippage_model:
  tick_mult: 2        # множитель тиков для расчёта проскальзывания
  spread_frac: 0.5    # доля спреда, теряемая как проскальзывание
  atr1m_k: 0.05       # множитель ATR(1m) для оценки проскальзывания

# Разрешать ли исполнение ордеров вне основного RTH (Regular Trading Hours).
outside_rth: false

# Биржевая таймзона (используется при обработке времени).
exchange_tz: America/New_York

# Жесткий лимит загрузки капитала: при >= значении новые сделки отклоняются.
equity_utilization_hard_cap: 0.75

# Жёсткость калибровки вероятности:
# 1.0 = почти не трогаем p_win_raw, 0.0 = всё стягиваем к 0.5.
calibration_alpha: 0.7
